name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Tauri App (Apple Silicon & Intel)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LearnForExam ${{ github.ref_name }}"
          releaseBody: |
            期末速通 (LearnForExam) 桌面端安装包已发布！
            - **Intel 芯片 Mac**: 请下载 `_x64.dmg`
            - **Apple Silicon (M1/M2/M3/M4) Mac**: 请下载 `_aarch64.dmg`
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
